<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="800" viewBox="0 0 1520 800" role="img" aria-label="Three-layer cybernetic routing architecture: harness roles, provider profile slots, provider instances, wired by a dispatch adapter with four closed feedback loops">
  <defs>
    <linearGradient id="bgwash" x1="0" y1="0" x2="1520" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.5" stop-color="#0C1524"/>
      <stop offset="1" stop-color="#0A101C"/>
    </linearGradient>
    <linearGradient id="edge1" x1="0" y1="70" x2="1320" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.35"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 15px; font-weight: 700; fill: #E2E8F0; }
      .sub { font-size: 12px; fill: #94A3B8; }
      .chip { font-size: 12px; fill: #E2E8F0; }
      .seat { font-size: 10.5px; fill: #CBD5E1; }
      .col { font-size: 10px; font-weight: 700; letter-spacing: 0.09em; fill: #64748B; }
      .cell { font-size: 11.5px; fill: #E2E8F0; }
      .cellMuted { font-size: 11.5px; fill: #94A3B8; }
      .pname { font-size: 14px; font-weight: 700; fill: #E2E8F0; }
      .pmeta { font-size: 10.5px; fill: #94A3B8; }
      .pmodels { font-size: 10.5px; fill: #CBD5E1; }
      .foot { font-size: 11.5px; fill: #94A3B8; }
    </style>
  </defs>

  <rect width="1520" height="800" rx="22" fill="url(#bgwash)"/>
  <rect x="0.75" y="0.75" width="1518.5" height="798.5" rx="21.25" fill="none" stroke="#1C2637" stroke-width="1.5"/>

  <!-- ============ LAYER 1: HARNESS ============ -->
  <rect x="60" y="70" width="1260" height="210" rx="16" fill="#111C2E" stroke="url(#edge1)" stroke-width="1.5"/>
  <text class="sans title" x="84" y="102">1 · HARNESS</text>
  <text class="sans sub" x="196" y="102">provider-neutral · AGENTS.md + skills/ + agents/ · no model IDs anywhere</text>

  <g>
    <rect x="84" y="118" width="192" height="32" rx="8" fill="#16233A" stroke="#2A3B57"/>
    <text class="sans chip" x="180" y="139" text-anchor="middle">oneshot</text>
    <rect x="288" y="118" width="192" height="32" rx="8" fill="#16233A" stroke="#2A3B57"/>
    <text class="sans chip" x="384" y="139" text-anchor="middle">shape</text>
    <rect x="492" y="118" width="192" height="32" rx="8" fill="#16233A" stroke="#2A3B57"/>
    <text class="sans chip" x="588" y="139" text-anchor="middle">plan</text>
    <rect x="696" y="118" width="192" height="32" rx="8" fill="#16233A" stroke="#2A3B57"/>
    <text class="sans chip" x="792" y="139" text-anchor="middle">dispatch</text>
    <rect x="900" y="118" width="192" height="32" rx="8" fill="#16233A" stroke="#2A3B57"/>
    <text class="sans chip" x="996" y="139" text-anchor="middle">tdd</text>
    <rect x="1104" y="118" width="192" height="32" rx="8" fill="#16233A" stroke="#2A3B57"/>
    <text class="sans chip" x="1200" y="139" text-anchor="middle">debug</text>

    <rect x="84" y="156" width="192" height="32" rx="8" fill="#16233A" stroke="#2A3B57"/>
    <text class="sans chip" x="180" y="177" text-anchor="middle">verify</text>
    <rect x="288" y="156" width="192" height="32" rx="8" fill="#16233A" stroke="#2A3B57"/>
    <text class="sans chip" x="384" y="177" text-anchor="middle">council</text>
    <rect x="492" y="156" width="192" height="32" rx="8" fill="#16233A" stroke="#2A3B57"/>
    <text class="sans chip" x="588" y="177" text-anchor="middle">make-ci-green</text>
    <rect x="696" y="156" width="192" height="32" rx="8" fill="#16233A" stroke="#2A3B57"/>
    <text class="sans chip" x="792" y="177" text-anchor="middle">land</text>
    <rect x="900" y="156" width="192" height="32" rx="8" fill="#16233A" stroke="#2A3B57"/>
    <text class="sans chip" x="996" y="177" text-anchor="middle">domain-modeling</text>
    <rect x="1104" y="156" width="192" height="32" rx="8" fill="#16233A" stroke="#2A3B57"/>
    <text class="sans chip" x="1200" y="177" text-anchor="middle">codebase-design</text>
  </g>

  <text class="sans sub" x="84" y="218">9 role-contract seats</text>

  <g>
    <rect x="84" y="228" width="122" height="28" rx="7" fill="#0F2230" stroke="#1F4A56"/>
    <text class="mono seat" x="145" y="246" text-anchor="middle">scout</text>
    <rect x="220" y="228" width="122" height="28" rx="7" fill="#0F2230" stroke="#1F4A56"/>
    <text class="mono seat" x="281" y="246" text-anchor="middle">tester</text>
    <rect x="356" y="228" width="122" height="28" rx="7" fill="#0F2230" stroke="#1F4A56"/>
    <text class="mono seat" x="417" y="246" text-anchor="middle">implementer</text>
    <rect x="492" y="228" width="122" height="28" rx="7" fill="#0F2230" stroke="#1F4A56"/>
    <text class="mono seat" x="553" y="246" text-anchor="middle">impl-deep</text>
    <rect x="628" y="228" width="122" height="28" rx="7" fill="#0F2230" stroke="#1F4A56"/>
    <text class="mono seat" x="689" y="246" text-anchor="middle">patch</text>
    <rect x="764" y="228" width="122" height="28" rx="7" fill="#1A1B38" stroke="#3B3C6B"/>
    <text class="mono seat" x="825" y="246" text-anchor="middle">reviewer-a</text>
    <rect x="900" y="228" width="122" height="28" rx="7" fill="#1A1B38" stroke="#3B3C6B"/>
    <text class="mono seat" x="961" y="246" text-anchor="middle">reviewer-b</text>
    <rect x="1036" y="228" width="122" height="28" rx="7" fill="#1A1B38" stroke="#3B3C6B"/>
    <text class="mono seat" x="1097" y="246" text-anchor="middle">reviewer-c</text>
    <rect x="1172" y="228" width="122" height="28" rx="7" fill="#1A1B38" stroke="#3B3C6B"/>
    <text class="mono seat" x="1233" y="246" text-anchor="middle">reviewer-esc</text>
  </g>

  <!-- dispatch arrow -->
  <line x1="690" y1="284" x2="690" y2="314" stroke="#94A3B8" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text class="sans sub" x="706" y="305">dispatch adapter resolves the role's rung, in ladder order</text>

  <!-- ============ LAYER 2: PROFILE ============ -->
  <rect x="60" y="322" width="1260" height="196" rx="16" fill="#111C2E" stroke="#2A3B57" stroke-width="1.5"/>
  <text class="sans title" x="84" y="354">2 · PROVIDER PROFILE</text>
  <text class="sans sub" x="266" y="354">PROVIDERS.md · primary → fallback → last-resort per role · validated before install writes</text>

  <text class="sans col" x="84" y="382">ROLE</text>
  <text class="sans col" x="224" y="382">PRIMARY</text>
  <text class="sans col" x="600" y="382">FALLBACK</text>
  <text class="sans col" x="960" y="382">LAST RESORT</text>
  <line x1="84" y1="390" x2="1296" y2="390" stroke="#243450" stroke-width="1"/>

  <g class="mono">
    <text class="cell" x="84" y="412">implementer</text>
    <text class="cell" x="224" y="412">antigravity / gemini-4-argon · high</text>
    <text class="cellMuted" x="600" y="412">antigravity / claude-sonnet-5-5 · medium</text>
    <text class="cellMuted" x="960" y="412">codex / gpt-6.1-sol · medium</text>

    <text class="cell" x="84" y="440">tester</text>
    <text class="cell" x="224" y="440">opencode / deepseek-v4.1-flash · high</text>
    <text class="cellMuted" x="600" y="440">codex / gpt-6-luna · medium</text>
    <text class="cellMuted" x="960" y="440">antigravity / gemini-3.8-flash</text>

    <text class="cell" x="84" y="468">reviewer-esc</text>
    <text class="cell" x="224" y="468">opencode / kimi-k3.1-pro · high</text>
    <text class="cellMuted" x="600" y="468">opencode / mimo-v2.6-pro</text>
    <text class="cellMuted" x="960" y="468">opencode / qwen3.8-max</text>
  </g>

  <g>
    <rect x="84" y="482" width="120" height="24" rx="6" fill="#0F2230" stroke="#1F4A56"/>
    <text class="mono sub" x="144" y="498" text-anchor="middle">## Quota pools</text>
    <rect x="214" y="482" width="130" height="24" rx="6" fill="#0F2230" stroke="#1F4A56"/>
    <text class="mono sub" x="279" y="498" text-anchor="middle">## Backup ladder</text>
    <rect x="354" y="482" width="180" height="24" rx="6" fill="#0F2230" stroke="#1F4A56"/>
    <text class="mono sub" x="444" y="498" text-anchor="middle">state/quota-ledger.tsv</text>
  </g>
  <text class="sans sub" x="550" y="498">shared buckets + soft caps · profile backup safety net · machine-local ledger</text>

  <!-- delegate arrow -->
  <line x1="690" y1="520" x2="690" y2="550" stroke="#94A3B8" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text class="sans sub" x="706" y="541">native pin on OpenCode, or T3 Code delegate_task(provider, model, effort)</text>

  <!-- ============ LAYER 3: PROVIDER INSTANCES ============ -->
  <rect x="60" y="558" width="1260" height="178" rx="16" fill="#111C2E" stroke="#2A3B57" stroke-width="1.5"/>
  <text class="sans title" x="84" y="590">3 · PROVIDER INSTANCES</text>
  <text class="sans sub" x="306" y="590">one profile slot resolves to one provider instance, model and effort</text>

  <g>
    <rect x="84" y="604" width="290" height="100" rx="12" fill="#0F2230" stroke="#1F4A56"/>
    <text class="sans pname" x="104" y="632">Antigravity</text>
    <text class="sans pmeta" x="104" y="652">google · anthropic · thinking_level</text>
    <text class="mono pmodels" x="104" y="674">gemini-4-argon (high)</text>
    <text class="mono pmodels" x="104" y="691">claude-opus-5-5 (high)</text>

    <rect x="391" y="604" width="290" height="100" rx="12" fill="#0F2230" stroke="#1F4A56"/>
    <text class="sans pname" x="411" y="632">Codex</text>
    <text class="sans pmeta" x="411" y="652">openai · reasoningEffort</text>
    <text class="mono pmodels" x="411" y="674">gpt-6-astra (high)</text>
    <text class="mono pmodels" x="411" y="691">gpt-6.1-sol (medium)</text>

    <rect x="698" y="604" width="290" height="100" rx="12" fill="#0F2230" stroke="#1F4A56"/>
    <text class="sans pname" x="718" y="632">OpenCode Go Plus</text>
    <text class="sans pmeta" x="718" y="652">deepseek · xiaomi · minimax · moonshot</text>
    <text class="mono pmodels" x="718" y="674">flash workhorses (high)</text>
    <text class="mono pmodels" x="718" y="691">pro council + escalation</text>

    <rect x="1005" y="604" width="290" height="100" rx="12" fill="#0E1A2A" stroke="#3B4A63" stroke-dasharray="6 5"/>
    <text class="sans pname" x="1025" y="632">Claude Code</text>
    <text class="sans pmeta" x="1025" y="652">quad profile only · claudeAgent</text>
    <text class="mono pmodels" x="1025" y="674">claude-opus-5-5 (high)</text>
    <text class="mono pmodels" x="1025" y="691">claude-sonnet-5-5 (medium)</text>
  </g>

  <!-- ============ FEEDBACK LOOP CHANNEL ============ -->
  <path d="M 1320 700 L 1380 700 L 1380 176 L 1320 176"
        fill="none" stroke="#38BDF8" stroke-width="1.75" stroke-dasharray="7 6"
        opacity="0.8" marker-end="url(#arrowLoop)"/>
  <text class="sans sub" transform="translate(1415 438) rotate(-90)" text-anchor="middle" fill="#38BDF8">L1 Task · L2 Council · L3 CI · L4 Meta</text>

  <text class="sans foot" x="84" y="768">Hosts: OpenCode V2 · T3 Code · Codex · Antigravity · Claude Code</text>
  <text class="sans foot" x="650" y="768">Fallback: exhausted or soft-capped rung → next rung → backup ladder → budget stop</text>
</svg>
